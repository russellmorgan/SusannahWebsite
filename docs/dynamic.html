<body class="text-neutral-800 bg-white crimson-text-regular">

      <h2 class="crimson-text-bold">Selected Work</h2>
      <div id="content">
        loading...
      </div>
    </div>
  </div>
  <script>
    const SHEET_ID = "14KIRdlHu_CmnZCUg-ssRM18rD5dg2W0OJEHMIXKi2bs";
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

    async function fetchSheetData() {
      try {
        const res = await fetch(SHEET_URL);
        const text = await res.text();
        const json = JSON.parse(text.substring(47, text.length - 2));

        // First row = headers, skip it
        const rows = json.table.rows.slice(1).map(r => r.c.map(c => (c ? c.v : "")));


        // Map to objects
        const works = rows
          .map(([title, url, category, publication]) => ({ title, url, category, publication }))
          .filter(item => item.category && item.category.toLowerCase() !== "audio");

        // Group by category
        const grouped = works.reduce((acc, item) => {
          if (!item.category) return acc;
          acc[item.category] = acc[item.category] || [];
          acc[item.category].push(item);
          return acc;
        }, {});

        renderContent(grouped);
      } catch (err) {
        console.error(err);
        document.getElementById("content").textContent = "Failed to load data.";
      }
    }

    function renderContent(grouped) {
      const container = document.getElementById("content");
      container.innerHTML = "";
      Object.keys(grouped).forEach(category => {
        const section = document.createElement("section");
        // Category header removed

        const categoryHeader = document.createElement("h3");
        categoryHeader.textContent = category;
        categoryHeader.classList.add("crimson-text-semibold");
        // To do, figure out category header new names
        section.appendChild(categoryHeader);
        const ul = document.createElement("ul");
        ul.classList.add("crimson-text-regular");
        grouped[category].forEach(item => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = item.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = item.title;
          // Append publication if present
          if (item.publication) {
            const pubSpan = document.createElement("strong");
            pubSpan.textContent = ` — ${item.publication}`;
            a.appendChild(pubSpan);
          }
          li.appendChild(a);
          ul.appendChild(li);
        });
        section.appendChild(ul);
        container.appendChild(section);
      });
    }

    fetchSheetData();
  </script>
</body>

</html>
